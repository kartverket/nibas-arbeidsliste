server:
  port: 8080

nibas:
  api:
    base-url: https://nibas.atkv3-dev.kartverket-intern.cloud/v1/

# API-key mot nibas-backend
api:
  key:
    matrikkel: ${API_KEY_MATRIKKEL:}

spring:
  main:
    banner-mode: "OFF"
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        jdbc:
          time_zone: "Europe/Oslo"
    show-sql: false
  jackson:
    time-zone: "Europe/Oslo"

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: 'health, prometheus'
    jmx:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      access: unrestricted
  info:
    env:
      enabled: true

info:
  application:
    name: 'nibas-arbeidsliste'
    version: ${PROJECT_VERSION:0.0.1}
