logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n'

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: nibas_arbeidsliste_schema
    show-sql: true
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    schemas: nibas_arbeidsliste_schema
    create-schemas: true
  sql:
    init:
      mode: always
      platform: postgresql

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
  packages-to-scan: no.kartverket.nibas.nibasarbeidsliste.controller
