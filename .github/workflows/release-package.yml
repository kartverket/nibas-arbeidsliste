name: Deploy to DEV
on:
  push:
    branches: [ main ]

jobs:
  build:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
      issues: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets: inherit

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@aee5b200a4bb042954127dd1446408d2841fcc29 #v0.7.1
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-dev:
    permissions:
      contents: read
      id-token: write
    needs: [ build, pharos ]
    uses: kartverket/smia-workflows/.github/workflows/deploy-app.yml@main
    with:
      application: nibas-arbeidsliste
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      environment: dev
      namespace: nibas-main
      identity: nibas
