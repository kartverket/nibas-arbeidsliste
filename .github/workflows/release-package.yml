name: Release app
on:
  push:
    branches: [ main ]

jobs:
  build:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    uses: kartverket/nibas-arbeidsliste/.github/workflows/build-native-app.yml@main
    secrets: inherit

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@v0.2.1
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-argo:
    needs: [pharos, build]
    uses: kartverket/smia-apps/.github/workflows/release-app.yml@main
    with:
      application: nibas-arbeidsliste
      version: ${{ needs.build.outputs.version }}
      deploy_dev: true
      deploy_test: true
      deploy_prod: false
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_ARGOCD }}