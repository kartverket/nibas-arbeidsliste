name: Deploy to DEV
on:
  push:
    branches: [ main ]

jobs:
  build:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
      issues: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets: inherit

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@v0.2.1
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-argo:
    permissions:
      id-token: write
    needs: [ build ]
    uses: kartverket/smia-apps/.github/workflows/release-app-octo-sts.yml@main
    with:
      application: nibas-arbeidsliste
      namespace: nibas-main
      version: ${{ needs.build.outputs.version }}
      deploy_dev: true
      deploy_prod: false
      identity: nibas
