name: Build non-native app
on:
  merge_group:
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      deploy_ghcr:
        description: "Deploy to ghcr?"
        default: false
        type: string
    outputs:
      version:
        description: "The version of the docker-image created"
        value: ${{ jobs.build.outputs.new_tag }}
      image_url:
        description: "The full URL to the docker-image created"
        value: ${{ jobs.build.outputs.image_url }}

env:
  image_name: nibas-arbeidsliste
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      image_url: ${{ steps.setOutput.outputs.image_url }}

    steps:
      - name: Set local timezone
        run: sudo timedatectl set-timezone "Europe/Oslo"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --info