name: Build app
on:
  merge_group:
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      deploy_ghcr:
        description: "Deploy to ghcr?"
        default: false
        type: string
    outputs:
      version:
        description: "The version of the docker-image created"
        value: ${{ jobs.build.outputs.new_tag }}
      image_url:
        description: "The full URL to the docker-image created"
        value: ${{ jobs.build.outputs.image_url }}

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      image_url: ${{ steps.setOutput.outputs.image_url }}

    steps:
      - name: Set local timezone
        run: sudo timedatectl set-timezone "Europe/Oslo"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_url=${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_OUTPUT

      - name: Build native image with Gradle
        run: ./gradlew bootBuildImage --imageName ${{ steps.setOutput.outputs.image_url }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push docker
        run: docker push ${{ steps.setOutput.outputs.image_url }}

